<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Web Design</title>
    <style>
      header {
        width: 600px;
        height: 40px;
        background-color: #1a365d;
        text-align: center;
        line-height: 40px;
        margin: 0 auto 15px auto;
        font-size: 20px;
        color: #ffffff;
      }
      nav {
        width: 600px;
        height: 40px;
        background-color: #0d9488;
        text-align: center;
        line-height: 40px;
        margin: 0 auto 15px auto;
        font-size: 24px;
        color: white;
      }
      main {
        width: 600px;
        height: 350px;
        background-color: #475569;
        color: #f1f5f9;
        margin: 0 auto 15px auto;
        padding: 15px;
        box-sizing: border-box;
      }
      article {
        width: 100%; /* Changed from 100px to 100% so it fills the box */
        height: 140px;
        background-color: #fce7db;
        color: #c2410c;
        text-align: left;
        padding: 15px;
        box-sizing: border-box;
        margin-bottom: 15px;
      }
      section {
        width: 100%;
        height: 140px;
        background-color: #e0e7ff;
        color: #3730a3;
        text-align: left;
        padding: 15px;
        box-sizing: border-box;
      }
      aside {
        width: 600px;
        height: 350px;
        background-color: #1e3a8a; /* Soft light gray card */
        color: #ffffff; /* Dark charcoal text */
        text-align: left;
        margin: 0 auto 15px auto; /* Centers it and creates bottom spacing */
        padding: 15px;
        box-sizing: border-box;
        font-size: 20px;
      }
      .content-wrapper {
        width: 600px;
        margin: 0 auto 15px auto;
        display: flex;
        gap: 10px;
        box-sizing: border-box;
      }

      footer {
        width: 600px;
        height: 40px;
        background-color: #1a365d;
        color: #ffffff;
        text-align: center;
        line-height: 40px;
        margin: 0 auto;
        font-size: 18px;
        box-sizing: border-box;
      }
    </style>
  </head>
  \
  <body>
    <header>header</header>
    <nav>nav</nav>

    <div class="content-wrapper">
      <main>
        main
        <article>article</article>
        <section>section</section>
      </main>
      <aside>aside</aside>
    </div>

    <footer>footer</footer>
  </body>
</html>
